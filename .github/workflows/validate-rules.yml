name: Firebase Rules Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    
    - name: Validate firebase.json
      run: |
        if [ ! -f "firebase.json" ]; then
          echo "❌ firebase.json not found!"
          exit 1
        fi
        echo "✓ firebase.json exists"
        
    - name: Validate Firestore rules
      run: |
        if [ ! -f "firestore.rules" ]; then
          echo "❌ firestore.rules not found!"
          exit 1
        fi
        echo "✓ firestore.rules exists"
        echo "📝 Firestore rules file size: $(wc -l < firestore.rules) lines"
        
    - name: Validate Storage rules
      run: |
        if [ ! -f "storage.rules" ]; then
          echo "❌ storage.rules not found!"
          exit 1
        fi
        echo "✓ storage.rules exists"
        echo "📝 Storage rules file size: $(wc -l < storage.rules) lines"
        
    - name: Check for deployment instructions
      run: |
        if [ ! -f "QUICK_FIX_PERMISSIONS.md" ]; then
          echo "⚠️  Warning: QUICK_FIX_PERMISSIONS.md not found"
        else
          echo "✓ Deployment guide exists"
        fi
        
        if [ ! -f "deploy-rules.sh" ]; then
          echo "⚠️  Warning: deploy-rules.sh not found"
        else
          echo "✓ Deployment script exists"
        fi
        
    - name: Summary
      run: |
        echo ""
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║  ✅ Firebase Rules Validation Passed                      ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        echo "📋 Files validated:"
        echo "  ✓ firebase.json"
        echo "  ✓ firestore.rules"
        echo "  ✓ storage.rules"
        echo ""
        echo "💡 To deploy these rules to Firebase:"
        echo "   firebase deploy --only firestore:rules,storage:rules"
        echo ""
        echo "   OR run: ./deploy-rules.sh"
        echo ""
